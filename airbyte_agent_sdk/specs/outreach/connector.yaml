openapi: 3.1.0

info:
  title: Outreach API Connector
  version: 1.0.1
  description: |
    Connector for the Outreach sales engagement platform API. Outreach helps sales teams
    automate and optimize their outreach workflows through sequences, templates, and
    prospect management. This connector provides read access to key Outreach entities
    including prospects, accounts, sequences, sequence states, opportunities, calls,
    mailings, tasks, users, stages, personas, templates, snippets, mailboxes,
    call dispositions, call purposes, and sequence steps.
  x-airbyte-connector-name: outreach
  x-airbyte-qualification:
    status: candidate
    criteria_version: v1
    bypassed_criteria:
      - criterion: C15
        reason: "sequence_states.get is x-airbyte-untested because the Outreach sandbox has no sequence states and none can be created: POST /sequenceStates returns HTTP 422 (\"Mailbox does not have send enabled.\", \"Mailbox has invalid send credentials.\") since the sandbox has no send-enabled mailbox. The get cassette can be recorded once a sending mailbox is connected."
  x-airbyte-connector-definition-id: 3490c201-5d95-4783-b600-eaf07a4c7787
  x-airbyte-replication-version: "1.1.48"
  x-airbyte-replication-compatibility: ">=1.1.48, <2.0.0"
  x-airbyte-external-documentation-urls:
    - type: api_reference
      title: Outreach API Reference
      url: https://developers.outreach.io/api/reference/
    - type: authentication_guide
      title: Outreach Authentication
      url: https://developers.outreach.io/api/oauth/
  x-airbyte-example-questions:
    direct:
      - "List all prospects in Outreach"
      - "Show me all active sequences"
      - "Get details about my Outreach accounts"
      - "List all users in my Outreach org"
      - "Show me recent calls logged in Outreach"
      - "List all mailings sent"
      - "What tasks are assigned in Outreach?"
    search:
      - "Find prospects added last month"
      - "Which sequences have the most active states?"
      - "Show me accounts in the technology industry"
      - "What are the top opportunities by amount?"
      - "Find calls made by a specific user"
    unsupported:
      - "Create a new prospect"
      - "Update an account"
      - "Delete a sequence"
      - "Send a mailing"
      - "Add a prospect to a sequence"
  x-airbyte-replication-config:
    title: Replication Configuration
    description: Settings for data replication from Outreach.
    properties:
      start_date:
        type: string
        title: Start Date
        description: >-
          The date from which you'd like to replicate data for Outreach API,
          in the format YYYY-MM-DDT00:00:00Z.
        format: date-time
    required:
      - start_date
    replication_config_key_mapping:
      start_date: start_date
    replication_config_constants:
      start_date: "{{ day_delta(-90, '%Y-%m-%dT%H:%M:%SZ') }}"
      redirect_uri: "https://app.airbyte.ai/auth_flow"

