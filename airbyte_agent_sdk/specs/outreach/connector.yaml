    # ── Sequences ────────────────────────────────────────────
    Sequence:
      type: object
      x-airbyte-entity-name: sequences
      x-airbyte-stream-name: sequences
      x-airbyte-ai-hints:
        summary: "Automated outreach sequences with engagement settings and statistics"
        when_to_use: "Questions about outreach sequences, automation workflows, or cadences"
        trigger_phrases: ["outreach sequence", "sales cadence", "automation", "email sequence"]
        freshness: live
        search_strategy: "Search by sequence name"
        example_questions:
          - "List all active sequences"
          - "Which sequences have the most steps?"
          - "Show me sequences created recently"
      description: Outreach sequence object
      properties:
        id:
          type: integer
          description: Unique sequence identifier
        type:
          type: ["null", string]
        attributes:
          type: object
          properties:
            name:
              type: ["null", string]
            description:
              type: ["null", string]
            sequenceType:
              type: ["null", string]
            enabled:
              type: ["null", boolean]
            tags:
              type: ["null", array]
              items:
                type: ["null", string]
            createdAt:
              type: ["null", string]
              format: date-time
            updatedAt:
              type: ["null", string]
              format: date-time
            aiTemplatePowered:
              type: ["null", boolean]
              description: AI template powered
            automationPercentage:
              type: ["null", number]
              format: float
              description: 'The percentage of ''auto_email'' sequence steps in this sequence.'
            bounceCount:
              type: ["null", integer]
              description: 'The total count of bounced mailings during this sequence.'
            clickCount:
              type: ["null", integer]
              description: 'The total count of clicked mailings from this sequence.'
            deliverCount:
              type: ["null", integer]
              description: 'The total count of delivered mailings from this sequence.'
            durationInDays:
              type: ["null", integer]
              description: 'The total number of days it takes to get through this sequence.'
            enabledAt:
              type: ["null", string]
              format: date-time
              description: 'The date and time the sequence was enabled, or null if currently disabled.'
            failureCount:
              type: ["null", integer]
              description: 'The total count of failed mailings from this sequence.'
            finishOnReply:
              type: ["null", boolean]
              description: 'Deprecated. This boolean value exists only to maintain backward compatibility and primaryReplyAction should be used instead. True if primaryReplyAction is ''finish'', false otherwise.'
            lastUsedAt:
              type: ["null", string]
              format: date-time
              description: 'The date and time the sequence was last used.'
            locked:
              type: ["null", boolean]
              description: 'A boolean value determining whether the sequence is locked or not.'
            lockedAt:
              type: ["null", string]
              format: date-time
              description: 'The date and time the sequence was locked, or null if currently unlocked.'
            maxActivations:
              type: ["null", integer]
              description: 'The maximum number of prospects that can be associated with the sequence. Only applies if the sequence type is ''date''.'
            negativeReplyCount:
              type: ["null", integer]
              description: 'The total count of negative reply mailings from this sequence.'
            neutralReplyCount:
              type: ["null", integer]
              description: 'The total count of neutral reply mailings from this sequence.'
            numContactedProspects:
              type: ["null", integer]
              description: 'The total count of prospects who have been either called or emailed.'
            numRepliedProspects:
              type: ["null", integer]
              description: 'The total count of prospects who have been marked as replied.'
            openCount:
              type: ["null", integer]
              description: 'The total count of opened mailings from this sequence.'
            optOutCount:
              type: ["null", integer]
              description: 'The total count of opted out mailings from this sequence.'
            positiveReplyCount:
              type: ["null", integer]
              description: 'The total count of positive reply mailings from this sequence.'
            primaryReplyAction:
              type: ["null", string]
              description: 'The action to take when the primary prospect replies. Must be one of ''finish'', ''continue'', or ''pause''.'
            primaryReplyPauseDuration:
              type: ["null", integer]
              description: 'The duration in seconds to pause for (before automatically finishing) after a reply from the primary prospect if the primaryReplyAction is ''pause''.'
            prospectClickCount:
              type: ["null", integer]
              description: Prospect click count
            prospectContactedCount:
              type: ["null", integer]
              description: Prospect contacted count
            prospectDeliverCount:
              type: ["null", integer]
              description: Prospect deliver count
            prospectOpenCount:
              type: ["null", integer]
              description: Prospect open count
            prospectReplyCount:
              type: ["null", integer]
              description: Prospect reply count
            replyCount:
              type: ["null", integer]
              description: 'The total count of replied mailings from this sequence.'
            salesMotion:
              type: ["null", string]
              description: 'The sales engagement type of the sequence.'
            scheduleCount:
              type: ["null", integer]
              description: 'The total count of scheduled mailings from this sequence.'
            scheduleIntervalType:
              type: ["null", string]
              description: 'The schedule interval type must be either ''calendar'' or ''schedule'''
            secondaryReplyAction:
              type: ["null", string]
              description: 'The action to take when someone other than the primary prospect replies. Must be one of ''finish'', ''continue'', or ''pause''.'
            secondaryReplyPauseDuration:
              type: ["null", integer]
              description: 'The duration in seconds to pause for (before automatically finishing) after a reply from anyone other than the primary prospect if the secondaryReplyAction is ''pause''.'
            sequenceStepCount:
              type: ["null", integer]
              description: 'The total number of sequence steps in this sequence.'
            shareType:
              type: ["null", string]
              description: 'The sequence share type must be either ''private'', ''read_only'' or ''shared''.'
            throttleCapacity:
              type: ["null", integer]
              description: 'The maximum number of associated sequence states per user that can be active at a one time.'
            throttleMaxAddsPerDay:
              type: ["null", integer]
              description: 'The maximum number of associated sequence states per user that can be added to the sequence each day.'
            throttlePaused:
              type: ["null", boolean]
              description: A boolean value determining whether the throttling of sequence states is paused or not.
            throttlePausedAt:
              type: ["null", string]
              format: date-time
              description: 'The date and time the sequence state throttling was paused, or null if not currently paused.'
            transactional:
              type: ["null", boolean]
              description: A boolean value determining whether prospect opt out preferences are respected. Intended only for non-marketing sequences.
          additionalProperties: true
        relationships:
          type: ["null", object]
          additionalProperties: true

        links:
          type: object
          description: Links associated with this resource
          properties:
            self:
              type: string
              description: URL for this resource
