components:
  securitySchemes:
    oauth2:
      type: oauth2
      description: OAuth 2.0 authentication for Outreach API
      flows:
        authorizationCode:
          authorizationUrl: https://api.outreach.io/oauth/authorize
          tokenUrl: https://api.outreach.io/oauth/token
          refreshUrl: https://api.outreach.io/oauth/token
          scopes:
            prospects.all: Full access to prospects
            accounts.all: Full access to accounts
            sequences.all: Full access to sequences
            opportunities.all: Full access to opportunities
            calls.all: Full access to calls
            mailings.all: Full access to mailings
            tasks.all: Full access to tasks
            users.all: Full access to users
            sequenceStates.all: Full access to sequence states
            sequenceSteps.all: Full access to sequence steps
            stages.all: Full access to stages
            personas.all: Full access to personas
            templates.all: Full access to templates
            snippets.all: Full access to snippets
            mailboxes.all: Full access to mailboxes
            callDispositions.all: Full access to call dispositions
            callPurposes.all: Full access to call purposes
      x-airbyte-token-refresh:
        auth_style: body
        body_format: form
      x-airbyte-auth-config:
        title: OAuth2 Authentication
        type: object
        required:
          - client_id
          - client_secret
          - refresh_token
        properties:
          client_id:
            type: string
            title: Client ID
            description: The Client ID of your Outreach developer application
          client_secret:
            type: string
            title: Client Secret
            description: The Client Secret of your Outreach developer application
          refresh_token:
            type: string
            title: Refresh Token
            description: The token for obtaining the new access token
        auth_mapping:
          client_id: "${client_id}"
          client_secret: "${client_secret}"
          refresh_token: "${refresh_token}"
        replication_auth_key_mapping:
          client_id: "client_id"
          client_secret: "client_secret"
          refresh_token: "refresh_token"
        replication_auth_key_constants:
          redirect_uri: "https://app.airbyte.ai/auth_flow"

  schemas:
    # ── JSON:API wrapper for single resource ─────────────────
    JsonApiResource:
      type: object
      properties:
        type:
          type: string
        id:
          type: integer
        attributes:
          type: object
        relationships:
          type: object
        links:
          type: object

    # ── Pagination Links ─────────────────────────────────────
    PaginationLinks:
      type: object
      properties:
        next:
          type: ["null", string]
          description: URL for the next page of results
        prev:
          type: ["null", string]
          description: URL for the previous page of results

    # ── Prospects ────────────────────────────────────────────
        first:
          type: string
          description: URL for the first page of results
    Prospect:
      type: object
      x-airbyte-entity-name: prospects
      x-airbyte-stream-name: prospects
      x-airbyte-ai-hints:
        summary: "Sales prospects and contacts with email, phone, and engagement data"
        when_to_use: "Looking up prospect contact info, engagement stats, or outreach activity"
        trigger_phrases: ["outreach prospect", "contact info", "sales lead", "prospect email", "who is this prospect"]
        freshness: live
        search_strategy: "Search by name, email, or company association"
        example_questions:
          - "List all prospects in Outreach"
          - "How many prospects have replied to sequences?"
          - "Show me prospects updated recently"
      description: Outreach prospect (contact) object
      properties:
        id:
          type: integer
          description: Unique prospect identifier
        type:
          type: ["null", string]
        attributes:
          type: object
          properties:
            firstName:
              type: ["null", string]
            lastName:
              type: ["null", string]
            emails:
              type: ["null", array]
              items:
                type: ["null", string]
            title:
              type: ["null", string]
            company:
              type: ["null", string]
            tags:
              type: ["null", array]
              items:
                type: ["null", string]
            createdAt:
              type: ["null", string]
              format: date-time
            updatedAt:
              type: ["null", string]
              format: date-time
            accountName:
              type: ["null", string]
              description: Account name
            addedAt:
              type: ["null", string]
              format: date-time
              description: The date and time the prospect was added to any system.
            addressCity:
              type: ["null", string]
              description: 'The prospect’s city (e.g. ''Seattle'').'
            addressCountry:
              type: ["null", string]
              description: 'The prospect’s country (e.g. ''USA'').'
            addressState:
              type: ["null", string]
              description: 'The prospect’s state (e.g. ''Washington'').'
            addressStreet:
              type: ["null", string]
              description: 'The prospect’s street address (e.g. ''1441 N 34th St'').'
            addressStreet2:
              type: ["null", string]
              description: The prospect’s second street address, if applicable.
            addressZip:
              type: ["null", string]
              description: 'The prospect’s postal code (e.g. ''98103'').'
            angelListUrl:
              type: ["null", string]
              description: The prospect’s AngelList URL.
            availableAt:
              type: ["null", string]
              format: date-time
              description: The date and time the prospect is available to contact again.
            callOptedOut:
              type: ["null", boolean]
              description: Whether the prospect is opted out of calling, or opted out in general if granular opt-out is not enabled.
            callsOptStatus:
              type: ["null", string]
              description: 'A string (''opted_in'', ''opted_out'', ''null'') that represents whether a prospect has opted into or out of calls.'
            callsOptedAt:
              type: ["null", string]
              format: date-time
              description: 'The date and time the prospect opted in/out of calls.'
            campaignName:
              type: ["null", string]
              description: The name of the campaign the prospect is associated with.
            clickCount:
              type: ["null", integer]
              description: 'The number of clicks the prospect has made since the last touch point.'
            companyIndustry:
